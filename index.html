<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./icons/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Blog preview card</title>
  </head>
  <body>
    <article class="card">
      <img
        src="./images/illustration-article.svg"
        alt="Illustration of the article of a drawing on a yellow background"
        class="card-img"
      />
      <div class="card-content">
        <p class="card-category">Learning</p>
        <p class="card-date">Published 21 Dec 2023</p>
        <h1 class="card-title">HTML & CSS foundations</h1>
        <p class="card-description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>
      <div class="card-author">
        <img
          src="./images/image-avatar.webp"
          alt="Avatar of the author Greg Hooper"
          class="card-author-avatar"
        />
        <p class="card-author-name">Greg Hooper</p>
      </div>
    </article>
  </body>
</html>
