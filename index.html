<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">

  <title>Blog preview card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <article class="card">
      <img class="card-image" src="./images/illustration-article.svg" alt="">

      <div class="card-content">
        <p class="card-category">Learning</p>
        <p class="card-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
        <h1 class="card-title"><a href="https://www.frontendmentor.io/" target="_blank" rel="noopener noreferrer">HTML &amp; CSS foundations</a></h1>
        <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>

      <div class="card-author">
        <img class="card-avatar" src="./images/image-avatar.webp" alt="">
        <p class="card-author-name">Greg Hooper</p>
      </div>
    </article>
  </main>
</body>
</html>
